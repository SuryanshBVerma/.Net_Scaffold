server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # LEARNING — SPA routing:
    #   Angular uses the HTML5 History API for routing (/products, /orders etc.)
    #   Without this block, nginx would return 404 for /products on a hard refresh
    #   because there is no physical file at that path.
    #   try_files: attempt to serve the file, then fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # LEARNING — API proxy (development alternative to Aspire):
    #   When running the container standalone (not via Aspire), set
    #   CATALOG_API_URL to an empty string and proxy /api/ here instead.
    #   Aspire handles this automatically in development.
    #
    # location /api/ {
    #     proxy_pass http://product-catalog:8080;
    # }

    # Cache static assets aggressively; never cache index.html or env.js
    location ~* \.(js|css|png|jpg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(index\.html|assets/env\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
