name: Integration Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexaCommerce.slnx --locked-mode

      - name: Run integration tests
        run: dotnet test tests/integration/NexaCommerce.ProductCatalog.IntegrationTests/NexaCommerce.ProductCatalog.IntegrationTests.csproj --configuration Release --no-restore --verbosity normal
