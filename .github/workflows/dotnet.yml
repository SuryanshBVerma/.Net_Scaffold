name: .NET Build & Test

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  # ── Job 1: Unit tests (fast, no Docker required) ──────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexaCommerce.slnx --locked-mode

      - name: Build
        run: dotnet build NexaCommerce.slnx --no-restore

      - name: Unit tests
        run: |
          dotnet test backend/product-catalog/NexaCommerce.ProductCatalog.Tests/NexaCommerce.ProductCatalog.Tests.csproj --no-build --verbosity normal
          dotnet test backend/notifications/NexaCommerce.Notifications.Tests/NexaCommerce.Notifications.Tests.csproj --no-build --verbosity normal
          dotnet test backend/report-scheduler/NexaCommerce.ReportScheduler.Tests/NexaCommerce.ReportScheduler.Tests.csproj --no-build --verbosity normal

  # ── Job 2: Integration tests (Testcontainers — Docker available on ubuntu) ─
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore NexaCommerce.slnx

      - name: Build
        run: dotnet build NexaCommerce.slnx --no-restore

      - name: Integration tests (Testcontainers)
        run: dotnet test tests/integration/NexaCommerce.ProductCatalog.IntegrationTests/NexaCommerce.ProductCatalog.IntegrationTests.csproj --no-build --verbosity normal

